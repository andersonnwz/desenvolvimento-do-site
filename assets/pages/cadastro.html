<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-Smart Cell</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <a class="logo" href="../../index.html">
        ◈ SMART<br>CELL
    </a>
    <header class="cabecalho-topo">
        <img src="../images/logo.png" alt="Logo Smart Cell" class="logotipo">
    </header>
    <main class="container-principal">
        <section class="cartao-login">
            <h1>Cadastre-se na Smart Cell!</h1>

            <form action="#" method="POST" class="formulario-login">
                 <div class="grupo-campo">
                    <input type="name" required 
                    placeholder="Nome Completo" required>
                </div>

                <div class="grupo-campo">
                    <input type="text" id="identificador_usuario" name="identificador_usuario" 
                    placeholder="Gmail" required>
                </div>

                <div class="grupo-campo">
                    <input type="password" id="senha_usuario" name="senha_usuario" 
                    placeholder="Senha" required>
                </div> 

                 <div class="grupo-campo">
                    <input type="password" id="senha_usuario" name="senha_usuario" 
                    placeholder="Confirme a Senha" required>
                </div> 

                <div class="botao">
                    <button type="submit" class="botao-confirmar">CONFIRMAR</button>
                    

            </form>
        </section>
    </main>

</body>

</html>
